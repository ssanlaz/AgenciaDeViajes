<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="formulario.css">
    <link rel="shortcut icon" href="img/logo.png.png" type="image/x-icon">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <title>Formulario de contacto</title>
</head>
<body>
    <header>
        <div>
            <img src="img/logo.png.png " id="logo" alt="logo de la agencia">
        </div>
            <h1>Agencia de Viajes Internacionales EMS</h1> 
    </header>
    <br>
    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="destinos.html">Destinos</a></li>
            <li><a href="servicios.html">Servicios</a></li>
            <li><a href="formulario.html" id="unico">Contacto</a></li>
        </ul>
    </nav>
    <main>
        <section class="contacto" id="Form">
            <h2>Contáctanos</h2>
            <br>
                <form action="#" method="POST">
                     <div class="form-group">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre" required>
        
                        <label for="apeliidos">Apellidos:</label>
                        <input type="text" id="apellidos" name="apellidos" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
               
                        <label for="viaje">Selecciona tu destino:</label>
                            <select id="viaje" name="viaje" required>
                                <option value="">-- Selecciona un destino --</option>
                                <option value="Peru">Peru</option>
                                <option value="EEUU">EE.UU</option>
                                <option value="Venezuela">Mexico</option>
                                <option value="Colombia">Colombia</option>
                            </select>
                    </div>
                        <label for="mensaje">Mensaje:</label>
                        <textarea id="mensaje" name="mensaje" rows="4" required></textarea>
                        <br>
                        <br>
                        <button type="submit">Enviar</button>
                </form>
    </main>
    <footer>
        <p>&copy; 2025 Agencia de Viajes Sandra. Todos los derechos reservados.</p>
            <div class="iconos">
                <a href="#">
                    <ion-icon name="logo-twitter"></ion-icon>
                </a>
                <a href="#">
                     <ion-icon name="logo-instagram"></ion-icon>
                </a>
                <a href="#">
                    <ion-icon name="logo-facebook"></ion-icon>
                </a>
             </div>
    </footer>
</body>
</html>
